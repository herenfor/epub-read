name: 功能建议 / Feature request
description: 想要的新功能或改进。An idea for a new feature or an improvement.
title: "[功能建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / The problem
      description: 在什么场景下觉得不方便？Describe the situation where something is missing or awkward.
      placeholder: 例如：躺着用手机看书时，单手点屏幕翻页不方便……
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 希望怎么做 / Your idea
      description: 你设想的做法、入口或交互。How you imagine it working.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 适用平台 / Platforms
      multiple: true
      options:
        - Windows
        - Android 手机 / phone
        - Android 平板 / tablet
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代做法或参考 / Alternatives or references
      description: 选填。现在是怎么凑合的，或者别的阅读器是怎么做的（可附截图）。Optional.

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我搜过已有的 Issue 和 README 里的路线图，没有重复。I searched existing issues and the roadmap.
          required: true
