name: 问题反馈 / Bug report
description: 应用出错、卡住、闪退或功能不按预期工作。Something in the app is broken or behaves unexpectedly.
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！写得越具体，越快能复现和修好。如果是**某本书排版或显示不对**，请改用“书籍显示异常”模板。
        Thanks for reporting! If one book looks wrong, please use the "Book display problem" form instead.

        如果你的版本有「复制诊断信息」按钮，可在「日志与诊断」里复制；旧版本没有这个按钮时，直接按下面的版本和平台字段手填即可。
        If your version has a Copy diagnostics button, copy it from Logs & Diagnostics. Older versions without that button can just fill in the version and platform fields below.

  - type: input
    id: version
    attributes:
      label: 版本号 / App version
      description: 书架 › 设置 › 关于 里可以看到。Shown under Shelf › Settings › About.
      placeholder: 例如 0.3.8
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      options:
        - Windows（安装版 / installer）
        - Windows（便携版 / portable）
        - Android 手机 / phone
        - Android 平板 / tablet
        - Linux（桌面版 / desktop）
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: 系统与设备 / System and device
      description: 选填。Linux 可写发行版和桌面环境。Optional; on Linux include the distribution and desktop.
      placeholder: 例如 Windows 11 23H2；三星 S24，Android 15；Ubuntu 24.04，GNOME

  - type: dropdown
    id: install-source
    attributes:
      label: Linux 安装渠道 / Linux package channel
      description: 选填，仅 Linux 用户。按本机实际安装方式选择；不确定可留空。列出这些方式不代表对应渠道已经发行。Optional; Linux only. Listing a channel does not mean it has been released.
      options:
        - deb 包 / deb package
        - Flatpak
        - AUR
        - 自行构建 / built from source
        - 其他 / other
        - 不确定 / not sure

  - type: dropdown
    id: linux-session
    attributes:
      label: 图形会话（Linux） / Graphics session (Linux)
      description: 选填，仅 Linux 用户。不确定可留空。Optional; Linux only.
      options:
        - Wayland
        - X11
        - WSLg / WSL
        - 其他 / other
        - 不确定 / not sure

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 看到了什么现象？有报错提示的话请原样贴出。Describe what you saw, including any error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开书架，点开某本书
        2. 打开 Aa 面板，把字号调到最大
        3. 翻到下一章……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果 / Expected behavior
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率 / How often
      options:
        - 每次都会 / Every time
        - 有时会 / Sometimes
        - 只出现过一次 / Only once
    validations:
      required: true

  - type: input
    id: book
    attributes:
      label: 相关书籍 / Book
      description: 如果只在某本书上出现，请写书名（方便的话附上书的来源）。If it only happens with one book, name it.

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（选填） / Diagnostics (optional)
      description: |
        如果你的版本有「复制诊断信息」按钮，可在 书架 › 设置 › 关于 › 诊断日志 打开的「日志与诊断」面板里点击复制，再把复制到的 JSON 粘贴到这里。旧版本没有这个按钮时，不用找，直接按上面的版本、平台等字段手填即可。
        粘贴前请检查这段诊断文本，不要让它包含书名、文件路径、设备标识、账号密钥或其他隐私；也不要上传数据库、整个书库目录或整本书。
        If your version has a Copy diagnostics button, open Logs & Diagnostics from Shelf › Settings › About › Diagnostic Log, copy, and paste the JSON here. Older versions without the button can skip this and fill in the fields above instead.
        Before posting, check the pasted diagnostics: they should not contain book titles, file paths, device identifiers, credentials or other private data. Please also do not upload your database, whole library folder, or complete book files.
      placeholder: 粘贴「复制诊断信息」得到的 JSON；没有按钮可留空。 / Paste the copied JSON, or leave empty.

  - type: textarea
    id: media
    attributes:
      label: 截图或录屏 / Screenshots or recordings
      description: |
        选填。可直接拖入图片或视频。旧版本没有「复制诊断信息」按钮时，也可以把 书架 › 设置 › 关于 › 诊断日志 里的记录截图附上。
        Optional. Drag files in. If your version has no Copy diagnostics button, a screenshot of Shelf › Settings › About › Diagnostic Log also helps.

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我搜过已有的 Issue，没有重复。I searched existing issues.
          required: true
        - label: 我用的是最新版本，或已写明还没升级的原因。I am on the latest release, or said why not.
          required: true
