name: 书籍显示异常 / Book display problem
description: 某本书的排版、图片、字体、目录或注释显示不对。One book's layout, images, fonts, contents or notes look wrong.
title: "[书籍显示] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        SeLis 会尽量按书本身的排版显示。排版问题往往只在某本书上出现，书名和截图最关键。
        The reader follows each book's own layout, so the book and a screenshot matter most.

        如果你的版本有「复制诊断信息」按钮，可在「日志与诊断」里复制；旧版本没有这个按钮时，直接按下面的版本和平台字段手填即可。
        If your version has a Copy diagnostics button, copy it from Logs & Diagnostics. Older versions without that button can just fill in the version and platform fields below.

  - type: input
    id: version
    attributes:
      label: 版本号 / App version
      description: 书架 › 设置 › 关于。Shown under Shelf › Settings › About.
      placeholder: 例如 0.3.8
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      multiple: true
      options:
        - Windows
        - Android 手机 / phone
        - Android 平板 / tablet
        - Linux（桌面版 / desktop）
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: Linux 安装渠道 / Linux package channel
      description: 选填，仅 Linux 用户。按本机实际安装方式选择；不确定可留空。列出这些方式不代表对应渠道已经发行。Optional; Linux only. Listing a channel does not mean it has been released.
      options:
        - deb 包 / deb package
        - Flatpak
        - AUR
        - 自行构建 / built from source
        - 其他 / other
        - 不确定 / not sure

  - type: dropdown
    id: linux-session
    attributes:
      label: 图形会话（Linux） / Graphics session (Linux)
      description: 选填，仅 Linux 用户。不确定可留空。Optional; Linux only.
      options:
        - Wayland
        - X11
        - WSLg / WSL
        - 其他 / other
        - 不确定 / not sure

  - type: input
    id: book
    attributes:
      label: 书名 / Book title
      description: 书的名称、出版方或来源。Title, publisher or source.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 问题类型 / Kind of problem
      multiple: true
      options:
        - 版面、边距或分栏 / Page layout, margins or columns
        - 图片或插画 / Images or illustrations
        - 字体或字号 / Fonts or text size
        - 竖排或从右往左 / Vertical or right-to-left text
        - 目录或跳转 / Contents or links
        - 注释或弹注 / Footnotes or pop-up notes
        - 打开失败或很慢 / Fails to open or very slow
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: 出现位置与现象 / Where and what
      description: 第几章或哪一页，看到了什么。Which chapter or page, and what you see.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / Screenshots
      description: 有条件的话，附一张其他阅读器里同一页的截图作对比。A screenshot of the same page in another reader helps a lot.
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: 调整过的排版设置 / Layout settings you changed
      description: 选填。比如字号、行高、自定义字体、自定义 CSS、单页/双页/滚动。Optional.

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（选填） / Diagnostics (optional)
      description: |
        如果你的版本有「复制诊断信息」按钮，可在 书架 › 设置 › 关于 › 诊断日志 打开的「日志与诊断」面板里点击复制，再把复制到的 JSON 粘贴到这里。旧版本没有这个按钮时，不用找，直接按上面的版本、平台等字段手填即可。
        粘贴前请检查这段诊断文本，不要让它包含书名、文件路径、设备标识、账号密钥或其他隐私；也不要上传数据库、整个书库目录或整本书。
        If your version has a Copy diagnostics button, open Logs & Diagnostics from Shelf › Settings › About › Diagnostic Log, copy, and paste the JSON here. Older versions without the button can skip this and fill in the fields above instead.
        Before posting, check the pasted diagnostics: they should not contain book titles, file paths, device identifiers, credentials or other private data. Please also do not upload your database, whole library folder, or complete book files.
      placeholder: 粘贴「复制诊断信息」得到的 JSON；没有按钮可留空。 / Paste the copied JSON, or leave empty.

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我搜过已有的 Issue，没有重复。I searched existing issues.
          required: true
        - label: 我不会在这里上传受版权保护的整本书文件。I will not upload copyrighted book files here.
          required: true
