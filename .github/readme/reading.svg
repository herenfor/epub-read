<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="EPUB Reader: the contents drawer on desktop and a page turn on the phone">
<style>

.drawer { animation: drawer 10s infinite; }
@keyframes drawer {
  0%, 22% { transform: translateX(-250px); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  30%, 74% { transform: translateX(0); animation-timing-function: cubic-bezier(.4,0,1,1); }
  80%, 100% { transform: translateX(-250px); }
}
.dim { animation: dim 10s infinite; opacity: 0; }
@keyframes dim { 0%, 22% { opacity: 0; } 30%, 74% { opacity: 1; } 80%, 100% { opacity: 0; } }
.toc-pill { animation: tocpill 10s infinite; }
@keyframes tocpill { 0%, 22% { fill: #edf1f7; } 26%, 76% { fill: #2b5b9e; } 80%, 100% { fill: #edf1f7; } }
.toc-ink { animation: tocink 10s infinite; }
@keyframes tocink { 0%, 22% { stroke: #1a1a1a; } 26%, 76% { stroke: #fff; } 80%, 100% { stroke: #1a1a1a; } }
.toc-bar rect { animation: tocbar 10s infinite; }
@keyframes tocbar { 0%, 22% { fill: #c2c2c2; } 26%, 76% { fill: #dfe7f3; } 80%, 100% { fill: #c2c2c2; } }
.prog { animation: prog 10s infinite; }
@keyframes prog { 0% { transform: scaleX(.18); } 100% { transform: scaleX(.22); } }
.turn { animation: turn 9s infinite; }
@keyframes turn {
  0%, 26% { transform: translateX(0); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32%, 59% { transform: translateX(-216px); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  65%, 92% { transform: translateX(-432px); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  98%, 100% { transform: translateX(-648px); }
}
.tap { transform-box: fill-box; transform-origin: center; opacity: 0; animation: tap 3s infinite; }
@keyframes tap { 0%, 62% { opacity: 0; transform: scale(.4); } 70% { opacity: .45; transform: scale(1); } 82%, 100% { opacity: 0; transform: scale(1.5); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
