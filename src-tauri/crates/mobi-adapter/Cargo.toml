[package]
name = "mobi-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false
description = "Standalone MOBI6/KF8 parsing and temporary reading-EPUB adapter (vendored libmobi)"

# This crate is intentionally outside the application workspace. ER-0141 adds
# it as a path dependency; it does not change the application root Cargo files
# or lockfile in this task.
[workspace]

[lib]
name = "mobi_adapter"
path = "src/lib.rs"

[dependencies]
tempfile = "=3.27.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "=1.4.3"
