[package]
name = "epub-reader"
version = "0.1.9-beta.1"
description = "EPUB 阅读器（EPUB 2/3）"
license = "Apache-2.0"
authors = ["HeRenFor"]
edition = "2021"

[lib]
name = "epub_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.41"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(windows)'.dependencies]
# Official windows-rs bindings (MIT OR Apache-2.0), used only to enumerate
# DirectWrite font-family metadata. Font files are never opened or copied.
windows = { version = "0.61.3", features = ["Win32_Graphics_DirectWrite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
